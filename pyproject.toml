[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-enrich"
version = "0.1.0"
description = "Parallel product description + vector enrichment for catalog products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "python-dotenv>=1,<2",
  "openai>=1.40,<2",
  "azure-storage-blob>=12.19,<13",
  "azure-search-documents>=11.6,<12",
  "tenacity>=8.2,<10",
]

[project.scripts]
product-enrich = "product_enrich.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
